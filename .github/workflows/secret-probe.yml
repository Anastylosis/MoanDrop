name: Secret probe
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fingerprint the AUR key as delivered (never the value)
        env:
          KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          printf '%s' "$KEY" > /tmp/k
          echo "bytes: $(wc -c < /tmp/k)"
          echo "sha256: $(sha256sum /tmp/k | cut -d' ' -f1)"
          echo "first line: $(head -1 /tmp/k)"
          echo "last char is newline: $(tail -c1 /tmp/k | xxd -p)"
          ssh-keygen -y -f /tmp/k >/dev/null 2>&1 && echo "ssh-keygen: VALID" || echo "ssh-keygen: INVALID"
