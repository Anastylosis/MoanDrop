name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: Anastylosis/.github/.github/workflows/go-ci.yml@v1
    permissions:
      contents: read
      checks: write
      # Required unconditionally. The shared workflow's test job
      # declares id-token: write for Codecov's OIDC auth, and a reusable
      # workflow cannot request more than its caller grants — without this the
      # run fails at startup, before a single step executes.
      id-token: write
    secrets: inherit
    with:
      binary-name: moandrop
      main-package: .
      # A desktop tool: it must build and test on every OS it ships for,
      # not just the maintainer's.
      platform-tests: true
      # Fingerprinting and ranking are local; the only network code is the
      # moansubs client, which the tests never call live. CI proves it.
      offline-isolation: true
      # Fyne's OpenGL bindings are cgo: a plain GOOS/GOARCH cross-compile
      # disables cgo and can never build them, so per-OS binaries come from
      # the native platform-tests runners instead. The ubuntu jobs need the
      # X11/GL/Wayland headers the stock runner image lacks.
      cross-build-targets: '[]'
      apt-packages: >-
        libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev
        libxinerama-dev libxi-dev libxxf86vm-dev libxkbcommon-dev
        libwayland-dev wayland-protocols pkg-config
