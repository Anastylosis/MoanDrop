name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Binaries per OS/arch, MSD-style asset naming, via the shared release
  # workflow, plus debs/rpms (nfpm.yaml), the AUR package (packaging/aur)
  # and the Homebrew tap formula (packaging/homebrew).
  release:
    uses: Anastylosis/.github/.github/workflows/go-release.yml@v1
    permissions:
      contents: write
      discussions: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      binary-name: moandrop
      main-package: .
      # The category must already exist on the repo (Discussions on), or
      # finalizing the release fails after the artifacts are built.
      discussion-category: Announcements
      # Fyne's OpenGL bindings are cgo: binaries must be built on native
      # per-OS runners, the ubuntu jobs need GL/X11/Wayland headers, and
      # the Windows GUI binary must not flash a console window.
      native-artifacts: true
      windows-gui: true
      nfpm: true
      aur: true
      aur-pkgname: moandrop
      aur-commit-username: Wasylq
      aur-commit-email: wasylq@protonmail.com
      homebrew: true
      homebrew-tap: Anastylosis/homebrew-tap
      apt-packages: >-
        libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev
        libxinerama-dev libxi-dev libxxf86vm-dev libxkbcommon-dev
        libwayland-dev wayland-protocols pkg-config
